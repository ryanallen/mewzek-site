<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141d">
  <title>Mewzek — Family music</title>
  <link rel="icon" type="image/png" href="./mewzek-kitten.png">
  <style>
    :root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f3ff;background:#12141d}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#40244f 0,#211a31 38%,#12141d 75%)}
    main{width:min(100%,490px);text-align:center}img{width:156px;height:156px;object-fit:cover;border-radius:36px;box-shadow:0 22px 70px #0007}h1{font-size:clamp(3.5rem,11vw,5.5rem);letter-spacing:-.07em;line-height:1;margin:27px 0 8px}p{color:#d8ccdf;font-size:1.1rem;line-height:1.55;margin:0 auto 18px;max-width:35ch}.open-player{display:inline-block;margin-top:9px;padding:15px 32px;border-radius:999px;background:#f8f2ff;color:#201729;text-decoration:none;font-weight:700;font-size:1.05rem}.open-player:hover{background:#e4d5ff}.note{margin-top:35px;padding:20px;border:1px solid #ffffff26;border-radius:20px;background:#ffffff0b;color:#f2e9f4;font-size:1rem}.note strong{display:block;margin-bottom:6px;color:#fff}.spinner{width:42px;height:42px;margin:30px auto 0;border:4px solid #ffffff45;border-top-color:#f8f2ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <img src="./mewzek-kitten.png" alt="Tuxedo kitten wearing headphones">
    <h1>Mewzek</h1>
    <div id="checking" role="status" aria-live="polite">
      <p>Opening your music…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <div id="landing" hidden>
      <p>Our family music, wherever we are.</p>
      <a class="open-player" href="https://lancre.tail210d6c.ts.net:8443/" rel="noreferrer">Open player</a>
      <div class="note"><strong>Family devices</strong>Open mewzek.com once on home Wi-Fi to connect this browser. Then the player opens anywhere without a login.</div>
    </div>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('access') === 'unavailable') {
      document.getElementById('checking').hidden = true;
      document.getElementById('landing').hidden = false;
    } else {
      location.replace('https://lancre.tail210d6c.ts.net:8443/?auto=1');
    }
  </script>
  <noscript><style>#checking{display:none}#landing{display:block!important}</style></noscript>
</body>
</html>
